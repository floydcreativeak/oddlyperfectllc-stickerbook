  cta:
    label: See every price and policy
    hoverLabel: Spreadsheet lovers, rejoice
  stickers: [check]

contact:
  eyebrow: The easy part
  heading: Start With A Blind Date. We're Serious.
  intro: A free, 30-minute conversation to see if we're a good fit for each other. No obligation, no sales pitch, and no pretending it's a free strategy session.
  callHeading: Book Your Blind Date
  emailHeading: Email Us
  hoursHeading: Office Hours
  afterHours: After hours? Leave a voicemail and we'll call you back the next business day.
  emailBody: Prefer typing? Tell us a little about your business and what you're trying to get done.
  brochureHeading: Want It On Paper?
  stickers: [arrow-call, local]

about:
  eyebrow: Who's behind the clipboard
  heading: Tailored Is Our Whole Thing.
  intro: A marketing and communications partner for businesses and nonprofits that need marketing to actually happen.
  body:
    - Some clients can do the work and need experienced direction. Some need a hand making sure it gets done. Some need someone to take marketing off their plate entirely. We built a package for each, and you can move between them as your year changes.
    - We say what things cost before you ask. We don't take commissions from media or vendors, we don't sell access to our relationships, and we never bill you to fix our own mistakes.
  cta:
    label: Meet the person behind it
    hoverLabel: Organized, not intimidating
  stickers: [type-a, heart]

