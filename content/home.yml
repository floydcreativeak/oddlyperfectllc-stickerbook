seo:
  title: Oddly Perfect | Marketing & PR Partner, Kenai Peninsula, Alaska
  description: Marketing, PR and event help for Kenai Peninsula businesses and nonprofits. Published prices, plain English, no kickbacks. Book a free Blind Date With a Marketer.

hero:
  eyebrow: Marketing, minus the mystery
  headline: Oddly Specific. Perfectly Yours.
  headlineAccent: Perfectly Yours.
  sub: Your marketing partner on Alaska's Kenai Peninsula. Plans, campaigns, PR and events, explained in plain English and priced right out in the open.
  callLabel: Book a free Blind Date With a Marketer
  emailLabel: Or send an email
  dragHint: Peel any sticker. Stick it anywhere. We won't tell.
  stickers: [tailored, star, blind-date, bubble-hi, bolt, plain-english, heart, megaphone, coffee]

services:
  eyebrow: What we do
  heading: Everything Your Marketing Keeps Putting Off.
