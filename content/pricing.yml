projectsHeading: One-Time Projects
projectsIntro: For when you need one defined thing rather than an ongoing monthly relationship.
whenLabel: When you need it
projects:
  - name: Marketing Checkup + 90-Day Plan
    price: $2,500
    when: Tell us what is working, what is not and what to do next.
    details: We review your current marketing, messaging, advertising and communications, then hand you a prioritized 90-day action plan.
    icon: clipboard
  - name: Annual Marketing Plan
    price: $3,500
    when: Build the priorities, calendar and marketing roadmap for the year.
    details: Priorities, calendar, major campaigns, seasonal opportunities, advertising approach and a communications roadmap.
    icon: calendar
  - name: Messaging Reset
    price: $3,000
    when: We know what we do. We just do not explain it very well.
    details: Clarify your key messages, audience, business description, talking points and core marketing language.
    icon: bubble
  - name: Campaign Sprint
    price: $4,500
    when: One important thing needs focused promotion for about 4 to 6 weeks.
    details: One focused campaign with a concept, audience, messaging, rollout plan, media recommendations and up to 8 campaign communications.
    icon: bolt
  - name: PR Announcement
    price: $1,500
    when: We have news and need help telling people.
    details: A messaging consultation, one polished press release, a media contact strategy, distribution guidance and one follow-up cycle.
    icon: megaphone
  - name: Sponsorship Program
    price: $3,500
    when: Build a professional sponsorship structure and the tools to run it.
    details: Levels, pricing recommendations, benefits, packet copy, tracking, fulfillment, recognition and renewal tools. We build the program; we do not solicit sponsors.
    icon: badge

