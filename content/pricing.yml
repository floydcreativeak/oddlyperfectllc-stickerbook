    tagline: You have the logistics. We help get people there.
    includes:
      - Event positioning and messaging
      - Promotion timeline
      - Advertising and media recommendations
      - Social and email plans
      - PR approach when appropriate
      - Sponsor-recognition plan
      - Community promotion opportunities
      - Up to 8 finished event-marketing pieces
    icon: megaphone
  - name: Run Event Day
    price: $2,500
    tagline: You planned it. We run the room.
    includes:
