eventBoundariesHeading: Where The Event Help Stops
eventBoundaries:
  - No full-service event production
  - No large multi-day production management
  - No unlimited vendor management
  - No sponsor solicitation
  - You keep responsibility for vendor contracts and major decisions
  - Outside vendors are paid directly by you whenever practical
  - We may decline an event if it would put existing client commitments at risk

