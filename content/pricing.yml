# Pricing. Edit in Pages CMS under "Pricing".
# Every price below is a placeholder until the client confirms real numbers.
# Exactly one tier can be "featured" (it peeks out with a sticker).

seo:
  title: Pricing | Oddly Perfect PR & Social Media Management
  description: Clear monthly plans for social media management, PR and marketing, plus add-ons. No mystery math. Call Oddly Perfect to find your fit.

eyebrow: Pricing
heading: Clear Prices. No Mystery Math.
intro: Every plan is a starting point. We tailor the details on a quick call, then put it all in writing. No surprises, no fine print in size four font.
stickers: [check, coffee]
currency: USD

tiers:
  - name: The Starter
    tab: Starter
    price: $650
    cadence: per month
    pitch: For businesses ready to show up online consistently, without it eating their week.
    features:
      - Two social platforms, managed
      - Twelve posts a month, written and designed
      - Monthly content calendar for your approval
      - A short monthly results report
    color: mint
    cta: Start here
    placeholder: true

  - name: The Main Event
    tab: Main Event
    price: $1,350
    cadence: per month
    pitch: Social, PR and strategy working together. The plan most clients grow into, fast.
    features:
      - Three social platforms, managed
      - Twenty posts a month, plus stories
      - One press release or media pitch a month
      - Comments and messages answered
      - Monthly strategy call
    featured: true
    sticker: most-popular
    color: mustard
    cta: Book the favorite
    placeholder: true

  - name: The Full Spotlight
    tab: Spotlight
    price: $2,400
    cadence: per month
    pitch: For campaigns, launches and leaders who need a team in their corner every single day.
    features:
      - Everything in The Main Event
      - Up to five platforms, managed
      - Ongoing media outreach and interview prep
      - Reputation monitoring and replies
      - Campaign and event planning
      - Priority same-day responses
    color: blush
    cta: Go all in
    placeholder: true

