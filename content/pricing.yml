# Pricing: everything with a price tag. Edit in Pages CMS under "Pricing".
# Source: client planning packet (working draft, September 2026).
# Exactly one monthly package can be "featured" (it peeks out with a sticker).

seo:
  title: Pricing | Oddly Perfect Marketing & PR, Kenai Peninsula
  description: Monthly marketing partnerships from $1,500, one-time projects from $1,500 and event services from $2,500. Published prices, plain English, no kickbacks.

eyebrow: Pricing
heading: Clear Prices. No Mystery Math.
intro: Every price is published, every package is explained in plain English, and the first conversation is free. Commit to a year and you get the better rate plus the freedom to switch packages as you go.
stickers: [no-kickbacks, check]
currency: USD

priceLabels:
  flex: 12-Month Flex
  monthly: Month-to-month
  or: or

includesLabel: What's in the folder
bestForLabel: Best for
exampleLabel: For example
moreLabel: "+ {n} more. See the full list"

tiers:
  - name: I Need a Plan
    tab: Plan
    price: $1,500
    altPrice: $1,750
    cadence: per month
    pitch: You can do the work. You need experienced direction.
    bestFor: A business with someone who can handle the day-to-day work but needs experienced help deciding what to do, what to say, where to spend money and what should happen next.
    features:
      - One main marketing goal at a time
      - One 60-minute planning meeting each month
      - Rolling 90-day marketing plan
      - Marketing calendar
      - Campaign ideas and direction
      - Advertising and media guidance
      - Messaging help
      - Community partnership and visibility ideas
      - Sponsorship strategy guidance
      - Feedback on up to 4 marketing items you create each month
      - Help figuring out what is working and what is not
      - Recommendations for outside specialists when needed
    example: You need to recruit seasonal employees. We define the audience, message, advertising approach, timeline and what your staff should create. Your team does the work; we make sure they are working from a good plan.
    notes: []
    color: mint
    cta: Let's make a plan
    placeholder: false

  - name: Help Me Get It Done
    tab: Get It Done
    price: $2,750
    altPrice: $3,150
    cadence: per month
    pitch: You need strategy plus someone helping make sure the work happens.
    bestFor: A business that does not just need ideas. It needs someone helping make sure the marketing actually happens.
    features:
      - Two main marketing goals at a time
      - Two working and planning meetings each month
      - Marketing plan and calendar management
      - Campaign development
      - Copywriting
      - Social media content
      - Email and newsletter content
      - Radio, print and digital advertising copy
      - Press releases when appropriate
      - Simple graphics using your existing brand
      - Basic website copy updates
      - Advertising and media coordination
      - Coordination with your existing vendors and media reps
      - Community partnership ideas
      - Sponsorship strategy
      - Simple monthly reporting
      - Up to 8 routine finished marketing items each month
    example: ""
    notes:
      - "Routine items look like: a social post with a simple graphic, a customer email, a radio script, a print or digital ad, a press release, a basic flyer or a short website update."
      - We use the production time where your business needs it. We do not manufacture content just to fill a quota.
    featured: true
    sticker: featured-tier
    color: mustard
    cta: Let's get it done
    placeholder: false

  - name: Take Marketing Off My Plate
    tab: Off My Plate
    price: $4,250
    altPrice: $4,850
    cadence: per month
    pitch: You need someone to largely own and coordinate your marketing.
    bestFor: A business with enough marketing happening that somebody needs to own it, without hiring an in-house marketing director and team.
    features:
      - Three to four main marketing goals at a time
      - More frequent strategy and working meetings
      - Annual and quarterly planning
      - Marketing budget guidance
      - Coordination across advertising channels
      - Vendor oversight
      - Public relations and business communications
      - Community partnership development
      - Sponsorship strategy
      - Campaign management
      - Leadership-level marketing guidance
      - A seat in the right leadership meetings
      - More detailed reporting and recommendations
      - Up to 12 routine finished marketing items each month
      - Up to 2 larger communications pieces each month
    example: ""
    notes:
      - "Larger pieces look like: a substantial newsletter, a media package, a multi-version ad campaign or a bigger promotional piece."
      - Large events, complete rebrands, website development, major publications, extensive photo and video work and unusually large standalone campaigns are priced separately.
    color: blush
    cta: Take it off my plate
    placeholder: false

