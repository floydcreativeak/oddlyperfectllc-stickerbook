footnote: Paid advertising, printing, postage and other outside costs are never hidden inside a package. You pay vendors directly whenever practical, at their price, with no markup from us.

faqHeading: Money Questions, Answered
faq:
  - question: What's the difference between 12-Month Flex and month-to-month?
    answer: Flex is a 12-month commitment to us, not to one package. You get the lower price, a waived onboarding fee, locked pricing for the year and the freedom to switch packages. Month-to-month costs a little more, has a $750 onboarding fee and a 3-month minimum.
  - question: Can I switch packages?
    answer: On 12-Month Flex, yes. Send a written request at least 5 calendar days before month-end and the new package starts on the first of the next month. One change per month, no mid-month changes and no prorating.
  - question: Will I get surprise hourly bills?
    answer: No. Normal emails, regular calls, scheduled meetings and the everyday communication it takes to deliver your package are not tracked with a stopwatch. If something would cross into out-of-scope work, we tell you and get your approval first.
  - question: Is ad spend included?
    answer: No, and that's on purpose. Paid advertising, printing, postage and other outside costs are separate, and you pay vendors directly whenever practical. We don't take commissions or mark anything up.
  - question: Do nonprofits get a discount?
    answer: Yes. Qualified nonprofits automatically get 10% off professional service fees. No special ask, no private negotiation and the same discount for everyone.

cta:
  heading: Not Sure Which Folder Is Yours?
  body: Book a free Blind Date With a Marketer. Thirty minutes, no obligation, and you'll leave knowing whether we're the right fit.
  label: Book the blind date
