# "How we work": the sticky-storytelling section. 3 to 6 steps.
steps:
  - title: The Blind Date.
    body: A free 30-minute conversation. What you do, who you need to reach, what you've tried and what keeps falling through the cracks. Then we both decide if it's a fit.
    sticker: bubble-hi
    color: peri
  - title: We Pick The Right Fit.
    body: A monthly package, a one-time project or an event service. Everything is written down, including what is included and what is not, before any work starts.
    sticker: check
    color: mustard
  - title: We Plan It And Do It.
    body: A rolling 90-day plan, a calendar and the work itself, at the level you chose. You approve the important stuff and skip the busywork.
    sticker: bolt
    color: mint
  - title: We Report And Adjust.
    body: Simple, honest reporting on what worked and what didn't. On a Flex partnership, you can move up or down a package as your year changes.
    sticker: crown
    color: blush
