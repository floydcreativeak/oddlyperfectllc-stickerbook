# The sticker sheet. Sections reference stickers by id.
# kind: drawn  = hand-drawn SVG art (most stickers should be these)
# kind: label  = a short handwritten word sticker
# kind: emoji  = bundled Noto Emoji artwork on a die-cut sticker. Use sparingly:
#                max 1-2 per screen, and never put emoji in normal text.
# decorative: true hides the sticker from screen readers (it adds no information).

stickers:
  - kind: label
    id: tailored
    label: Tailored
    caption: Tailored!
    color: cream
    rotate: -7

  - kind: label
    id: no-wall
    label: No wall of text
    caption: No Wall of Text
    color: mint
    rotate: 5

  - kind: label
    id: on-it
    label: On it
    caption: On It.
    color: blush
    rotate: -4

  - kind: label
    id: ahead
    label: Three steps ahead
    caption: 3 Steps Ahead
    color: peri
    rotate: 6

  - kind: label
    id: type-a
    label: Type A and proud
    caption: Type A & Proud
    color: mustard
    rotate: -5

  - kind: label
    id: featured-tier
    label: The hands-on package
    caption: Hands-On
    color: tangerine
    rotate: 8
    decorative: false

  - kind: label
    id: no-kickbacks
    label: No kickbacks
    caption: No Kickbacks
    color: mint
    rotate: -6

  - kind: label
    id: plain-english
    label: Plain English
    caption: Plain English
    color: peri
    rotate: 5

  - kind: label
    id: local
