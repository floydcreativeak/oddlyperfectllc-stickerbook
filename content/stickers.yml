  - kind: drawn
    id: bolt
    label: Lightning bolt
    art: bolt
    color: mustard
    rotate: 10

  - kind: drawn
    id: heart
    label: Heart
    art: heart
    color: blush
    rotate: -10

  - kind: drawn
