  - kind: drawn
    id: target
    label: Bullseye
    art: target
    color: blush
    rotate: 6

  - kind: drawn
    id: squiggle
    label: Squiggle
    art: squiggle
    color: peri
    rotate: 0

  - kind: drawn
    id: badge
    label: Rosette badge
