# Publishes the site to GitHub Pages. Runs on every push to main, or by hand
# from the Actions tab ("Run workflow").
#
# It decides PREVIEW vs PRODUCTION from GitHub's own Pages settings:
#
#   PREVIEW     No custom domain set yet, so the site lives at
#               https://<owner>.github.io/<repo>/. Placeholders are allowed
#               and the site is hidden from search engines.
#
#   PRODUCTION  Custom domain set (Settings -> Pages -> Custom domain), so the
#               site lives at the root of oddlyperfectllc.com. The STRICT
#               content lint runs: if any placeholder photo, price, review or
#               detail is still flagged, the deploy stops with a list of what
#               to replace.
#
# "Force preview" (manual runs only) allows placeholders even on the custom
# domain, for a client walkthrough. Don't use it for launch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_preview:
        description: "Force preview (allow placeholders, hide from search)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reads this repo's Pages settings: origin (https://host) and base_path
      # ("" on a custom domain, "/<repo>" on the github.io address).
      - id: pages
        uses: actions/configure-pages@v5

      - name: Choose preview or production
        id: mode
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          FORCE: ${{ inputs.force_preview }}
        run: |
          if [ -n "$BASE" ] || [ "$FORCE" = "true" ]; then
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview deploy::Placeholders allowed, hidden from search engines."
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy::Strict content check is on."
          fi

      - name: Content lint (strict, blocks placeholders)
        if: steps.mode.outputs.preview == 'false'
        run: npm run lint:content:strict

      - name: Content lint (preview, placeholders allowed)
        if: steps.mode.outputs.preview == 'true'
        run: npm run lint:content

      - name: CMS config covers all content
        run: npm run lint:cms

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_PREVIEW: ${{ steps.mode.outputs.preview }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
